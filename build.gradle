import me.modmuss50.mpp.ReleaseType

plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.moddev'
    id 'me.modmuss50.mod-publish-plugin'
}

base {
    archivesName = modid
    version = "$modloader-mc$mcversion-v$modversion"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.valueOf(javaversion))

println "Java: ${System.getProperty 'java.version'}, Gradle Java: ${JavaVersion.current()}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// PARCHMENT COMES FROM THE neoForge.parchment.* KEYS IN gradle.properties;
// THE ACCESS TRANSFORMER IS PICKED UP AUTOMATICALLY FROM META-INF/accesstransformer.cfg
neoForge {
    version = fgversion

    runs {
        configureEach {
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'log4j.appender.Console', 'org.apache.log4j.ConsoleAppender'
            systemProperty 'terminal.jline', 'true'
            // COMMA-SEPARATED NAMESPACES TO LOAD GAMETESTS FROM; EMPTY = ALL NAMESPACES
            systemProperty 'forge.enabledGameTestNamespaces', modid
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        register(modid) {
            sourceSet sourceSets.main
        }
    }
}

// INCLUDE RESOURCES GENERATED BY DATA GENERATORS
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://jitpack.io' } // WATERMEDIA
    maven { // WATERMEDIA BINARIES — MODRINTH IS A UNIVERSAL PROXY, SO FILTER IT TO ITS OWN GROUP
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { // WATERVISION
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    // WATERMEDIA V3 UNIVERSAL JAR PLUS ITS PREBUILT FFMPEG NATIVES (RUNTIME-ONLY COMPANION MOD).
    // NON-TRANSITIVE: ITS POM PINS LWJGL 3.3.6 AND JOML 1.10.8, WHICH CLASH WITH THE VERSIONS
    // MINECRAFT DECLARES AS STRICT; THE GAME ALREADY SUPPLIES BOTH AT RUNTIME
    implementation("com.github.WaterMediaTeam:watermedia-v3:$watermediaversion") { transitive = false }
    runtimeOnly("maven.modrinth:watermedia-binaries:$watermediabinariesversion") { transitive = false }

    // WATERVISION IS AN OPTIONAL INTEGRATION; WVCompat GUARDS EVERY CALL BEHIND isInstalled
    compileOnly "curse.maven:watervision-1167473:$watervisionversion"
}

// SNAPSHOT OF gradle.properties (PLUS ANY -P OVERRIDE) TAKEN AT CONFIGURATION TIME: READING
// project FROM INSIDE A TASK ACTION IS DEPRECATED AND BREAKS THE CONFIGURATION CACHE
def templateProps = providers.gradlePropertiesPrefixedBy('').get()

// ALWAYS RE-EXPAND: GRADLE DOES NOT TRACK EVERY PROJECT PROPERTY AS A TASK INPUT
tasks.processResources.outputs.upToDateWhen { false }
processResources {
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta', 'resourcepacks/**/pack.mcmeta']) {
        expand templateProps
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"    : modid,
                "Specification-Vendor"   : modauthor,
                "Specification-Version"  : version,
                "Implementation-Title"   : modname,
                "Implementation-Version" : modversion,
                "Implementation-Vendor"  : modauthor
        ])
    }
    // COMPILE-ONLY STUBS OF THIRD PARTY APIS; SHIPPING THEM WOULD SHADOW THE REAL CLASSES
    exclude('org/valkyrienskies/**')
    exclude('dev/ryanhcode/**')
}

publishMods {
    file = tasks.jar.archiveFile
    displayName = "WF-$modloader/mc$mcversion/v$modversion"
    type = ReleaseType.valueOf(versiontype.toUpperCase())
    changelog = getChangelogText()
    modLoaders.add(modloader.toLowerCase())
    maxRetries = 2
    dryRun = false

    curseforge {
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        projectId = curseforgeid
        projectSlug = modid
        minecraftVersions.add(mcversion)
        javaVersions.add(JavaVersion.toVersion(javaversion))
        clientRequired = true
        serverRequired = true
        requires('watermedia')
        optional('watervision')
    }

    modrinth {
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        projectId = modrinthid
        minecraftVersions.add(mcversion)
        requires('watermedia')
        optional('watervision')
    }
}

// CHANGELOG = EVERY LINE OF CHANGELOG.md UP TO THE FIRST EMPTY ONE
def getChangelogText() {
    def result = ""
    for (String line: file('CHANGELOG.md').readLines('UTF-8')) {
        if (line.isEmpty()) return result
        result += line + '\n'
    }
    return result
}


// NORMALIZE ENHANCED-FOR COLONS IN JAVA SOURCES: "for (T x : xs)" -> "for (T x: xs)"
// (GRADLE PORT OF THE OLD scripts/remove_semicolon_space.ps1)
tasks.register('removeSemicolonSpace') {
    group = 'formatting'
    description = 'Removes the space before the enhanced-for colon across src/**/*.java'
    doLast {
        // (?m) ANCHORS ^ PER LINE; [ \t] AND [^:\r\n] KEEP EACH MATCH INSIDE ONE LINE SO LINE ENDINGS SURVIVE
        def regex = ~/(?m)(^[ \t]*for[ \t]*\([^:\r\n]*\w)[ \t]+:/
        fileTree(dir: 'src', include: '**/*.java').each { file ->
            def text = file.getText('UTF-8')
            def updated = text.replaceAll(regex, '$1:')
            if (updated == text) return

            def before = text.readLines()
            def after = updated.readLines()
            before.eachWithIndex { line, i ->
                if (after[i] != line) {
                    println "${file.path}:${i + 1}"
                    println "  - ${line.stripLeading()}"
                    println "  + ${after[i].stripLeading()}"
                }
            }
            file.write(updated, 'UTF-8')
        }
        println 'Done.'
    }
}
