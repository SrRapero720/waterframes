modLoader="javafml"
loaderVersion="${fgloaderrange}"
issueTrackerURL="https://github.com/${github_project}/issues"
logoFile="pack.png"
license="${modlicense}"

[[mods]]
	modId="${modid}"
	version="${modversion}"
	displayName="${modname}"
	displayTest="MATCH_VERSION"
	displayURL="https://www.curseforge.com/minecraft/mc-mods/waterframes"
	credits="${modcredits}"
	authors="${modauthor}"
	logoFile="pack.png"
	side="BOTH"
	description='''${mod_description}'''

[[mods]]
	modId="${wateruimodid}"
	version="${wateruiversion}"
	displayName="${wateruiname}"
	displayTest="IGNORE_ALL_VERSION"
	side="CLIENT"
	logoFile="pack.png"
	description='''${waterui_description}'''

[[accessTransformers]]
	file="META-INF/accesstransformer.cfg"

[[dependencies.${modid}]]
	modId="neoforge"
	type="required"
	versionRange="${fgrange}"
	ordering="NONE"
	side="BOTH"

[[dependencies.${modid}]]
	modId="watermedia"
	type="required"
	ordering="AFTER"
	side="CLIENT"
	versionRange="${watermediarange}"

[[dependencies.${modid}]]
	modId="${wateruimodid}"
	type="required"
	ordering="AFTER"
	side="CLIENT"
	versionRange="${wateruirange}"

[[dependencies.${wateruimodid}]]
	modId="neoforge"
	type="required"
	versionRange="${fgrange}"
	ordering="NONE"
	side="CLIENT"

[[dependencies.${wateruimodid}]]
	modId="watermedia"
	type="required"
	ordering="AFTER"
	side="CLIENT"
	versionRange="${watermediarange}"
