pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
    // PLUGIN VERSIONS LIVE IN gradle.properties; build.gradle APPLIES THEM VERSION-LESS
    plugins {
        id 'org.gradle.toolchains.foojay-resolver-convention' version foojayversion
        id 'net.neoforged.moddev' version moddevversion
        id 'me.modmuss50.mod-publish-plugin' version publishpluginversion
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention'
}

rootProject.name = modid
